name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Pinned: ubuntu-24.04 ships Postgres 16, matching local Homebrew postgresql@16.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost/postgres
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Start the runner's built-in Postgres
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h localhost && break; sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests
      - name: Tests with coverage (85% overall)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: Audit coverage gate (100%)
        run: uv run coverage report --include='*/prediction_desk/audit/*' --fail-under=100
      - name: Pricing coverage gate (100%)
        run: uv run coverage report --include='*/prediction_desk/pricing/*' --fail-under=100

  secrets:
    # Scans the ENTIRE git history on every run with the pinned gitleaks CLI.
    # (gitleaks-action@v2 builds a `<first>^..<last>` range from the push event,
    # which fails on a repository's first push because the root commit has no parent.)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan full git history for secrets
        run: gitleaks git --redact --verbose --exit-code 1 .
