[project]
name = "prediction-desk"
version = "0.1.0"
description = "Agentic paper-trading backend for prediction markets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.14.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "DTZ", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use prediction_desk.clock.Clock"
"datetime.datetime.utcnow".msg = "Use prediction_desk.clock.Clock"
"datetime.date.today".msg = "Use prediction_desk.clock.Clock"

[tool.ruff.lint.per-file-ignores]
"src/prediction_desk/clock.py" = ["TID251"]
"tests/**" = ["DTZ"]
# The revision template imports op/sa unconditionally; empty and merge revisions leave them unused.
"migrations/versions/*" = ["F401"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# --block-network (pytest-recording) fails any test that opens a Python socket; libpq (Postgres)
# is unaffected. pytest-recording lifts the block only for @pytest.mark.vcr tests when the record
# mode is not "none". To record a NEW keyless venue cassette, run just that test, e.g.:
#   uv run pytest --record-mode=once tests/markets/test_kalshi.py::test_recorded_orderbook_best_first
# Never record FRED or Alpha Vantage (ruling R8: hand-built fixtures; keys never in cassettes).
addopts = "-ra --block-network"

[tool.coverage.run]
source = ["prediction_desk"]
branch = true
