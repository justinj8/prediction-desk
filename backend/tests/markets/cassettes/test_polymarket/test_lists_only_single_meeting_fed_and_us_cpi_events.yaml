        on the target federal funds rate are made by the Federal Open Market Committee
        (FOMC) meetings.\\n\\nThis market will resolve according to the decisions
        made by the next three Federal Open Market Committee (FOMC) meetings: October
        27 to 28; December 8 to 9; and January 26 to 27.\\n\\nA qualifying cut occurs
        when the new upper bound of the target federal funds rate is lower compared
        to the level it was prior to the respective meeting.\\n\\nA qualifying hike
        occurs when the new upper bound of the target federal funds rate is higher
