        Decision in December?\",\"description\":\"The FED interest rates are defined
        in this market by the upper bound of the target federal funds range. The decisions
        on the target federal funds range are made by the Federal Open Market Committee
        (FOMC) meetings.\\n\\nThis market will resolve to the amount of basis points
        the upper bound of the target federal funds rate is changed by versus the
        level it was prior to the Federal Reserve's December 2026 meeting.\\n\\nIf
        the target federal funds rate is changed to a level not expressed in the displayed
        options, the change will be rounded up to the nearest 25 and will resolve
        to the relevant bracket. (e.g. if there's a cut/increase of 12.5 bps it will
        be considered to be 25 bps)\\n\\nThe resolution source for this market is
        the FOMC\u2019s statement after its meeting scheduled for December 8-9, 2026
        according to the official calendar: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm.\\n\\nThe
        level and change of the target federal funds rate is also published at the
        official website of the Federal Reserve at https://www.federalreserve.gov/monetarypolicy/openmarket.htm.\\n\\nThis
        market may resolve as soon as the FOMC\u2019s statement for their December
        meeting with relevant data is issued. If no statement is released by the end
        date of the next scheduled meeting, this market will resolve to the \\\"No
        change\\\" bracket.\",\"resolutionSource\":\"\",\"startDate\":\"2026-07-30T00:43:48.912145Z\",\"creationDate\":\"2026-07-30T01:03:13.640133Z\",\"endDate\":\"2026-12-10T04:59:00Z\",\"image\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/fed-decision-in-september-762-c4RyWuxRPo1L.jpg\",\"icon\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/fed-decision-in-september-762-c4RyWuxRPo1L.jpg\",\"active\":true,\"closed\":false,\"archived\":false,\"new\":false,\"featured\":true,\"restricted\":true,\"liquidity\":2089500.27868,\"volume\":23501872.638453,\"openInterest\":3351406.451062,\"sortBy\":\"ascending\",\"createdAt\":\"2026-07-30T00:36:56.42426Z\",\"updatedAt\":\"2026-11-10T16:18:26.642825Z\",\"competitive\":0.8936350841134023,\"volume24hr\":6146124.516442,\"volume1wk\":12379953.691574,\"volume1mo\":20589442.578612,\"volume1yr\":23542099.897520002,\"enableOrderBook\":true,\"liquidityClob\":2089500.27868,\"negRisk\":true,\"negRiskMarketID\":\"0xa74f5328517db0e030a5e62edc800e37bd36ca6e455571b14e8bb2b0dd38d700\",\"commentCount\":0,\"markets\":[{\"id\":\"3215005\",\"question\":\"Will
