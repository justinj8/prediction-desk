        decisions (Sep\u2013Dec)\",\"description\":\"The FED interest rates are defined
        in this market by the upper bound of the target federal funds rate. The decisions
        on the target federal funds rate are made by the Federal Open Market Committee
        (FOMC) meetings.\\n\\nThis market will resolve according to the decisions
        made by the next three Federal Open Market Committee (FOMC) meetings: September
        15-16; October 27-28; and December 8-9.\\n\\nA qualifying cut occurs when
        the new upper bound of the target federal funds rate is lower compared to
        the level it was prior to the respective meeting.\\n\\nA qualifying hike occurs
        when the new upper bound of the target federal funds rate is higher compared
        to the level it was prior to the respective meeting.\\n\\nA qualifying pause
        occurs when the new upper bound of the target federal funds rate is equal
        to the level it was prior to the respective meeting.\\n\\nIf the Fed publishes
        a different combination than any listed, this market will resolve to \\\"Other\\\".
        Any rate cut will be encompassed by \\\"Other\\\".\\n\\nEmergency rate changes
        outside the regularly scheduled meetings will not be considered.\\n\\nThe
        resolution source for this market is the FOMC\u2019s statement after its meetings:\\nhttps://www.federalreserve.gov/monetarypolicy/fomccalendars.htm\\n\\nThe
