        Decision in January?\",\"description\":\"The FED interest rates are defined
        in this market by the upper bound of the target federal funds range. The decisions
        on the target federal funds range are made by the Federal Open Market Committee
        (FOMC) meetings.\\n\\nThis market will resolve to the amount of basis points
        the upper bound of the target federal funds rate is changed by versus the
        level it was prior to the Federal Reserve's January 2027 meeting.\\n\\nIf
        the target federal funds rate is changed to a level not expressed in the displayed
        options, the change will be rounded up to the nearest 25 and will resolve
        to the relevant bracket. (e.g. if there's a cut/increase of 12.5 bps it will
        be considered to be 25 bps)\\n\\nThe resolution source for this market is
        the FOMC\u2019s statement after its meeting scheduled for January 26-27, 2027
        according to the official calendar: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm.\\n\\nThe
        level and change of the target federal funds rate is also published at the
        official website of the Federal Reserve at https://www.federalreserve.gov/monetarypolicy/openmarket.htm.\\n\\nThis
        market may resolve as soon as the FOMC\u2019s statement for their January
        meeting with relevant data is issued. If no statement is released by the end
        date of the next scheduled meeting, this market will resolve to the \\\"No
        change\\\" bracket.\",\"resolutionSource\":\"\",\"startDate\":\"2026-07-30T00:48:09.895382Z\",\"creationDate\":\"2026-07-30T01:01:14.704907Z\",\"endDate\":\"2027-01-28T04:59:00Z\",\"image\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/fed-decision-in-september-762-c4RyWuxRPo1L.jpg\",\"icon\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/fed-decision-in-september-762-c4RyWuxRPo1L.jpg\",\"active\":true,\"closed\":false,\"archived\":false,\"new\":false,\"featured\":false,\"restricted\":true,\"liquidity\":493090.08158,\"volume\":1619857.528204,\"openInterest\":220541.259803,\"sortBy\":\"ascending\",\"createdAt\":\"2026-07-30T00:37:27.049177Z\",\"updatedAt\":\"2026-11-10T16:18:26.642825Z\",\"competitive\":0.9987764987889834,\"volume24hr\":308375.41868,\"volume1wk\":492024.37758100004,\"volume1mo\":1331221.660248,\"volume1yr\":1620733.868204,\"enableOrderBook\":true,\"liquidityClob\":493090.08158,\"negRisk\":true,\"negRiskMarketID\":\"0x2f5b09591c9aca3a466286d56eb29c2ef4e43e86fcb8b7d298b87adb81517600\",\"commentCount\":0,\"markets\":[{\"id\":\"3215010\",\"question\":\"Will
