        out as Fed Chair by\u2026?\",\"description\":\"This market will resolve to
        \\\"Yes\\\" if Kevin Warsh\u2019s departure as Chair of the Federal Reserve
        of the United States is officially announced by the specified date, 11:59
        PM ET. Otherwise, this market will resolve to \\\"No\\\".\\n\\nThe departure
        will be considered to be announced when Kevin Warsh, the Federal Reserve of
        the United States, or their authorized representatives publicly and definitively
        announce that Kevin Warsh has ceased or will cease to hold the position of
        Chair of the Federal Reserve of the United States. Such an announcement will
        qualify regardless of when the specified person formally leaves the position.
        Announcements of the specified person's resignation, removal, or departure
        through other means all qualify.\\n\\nOnly announcements which are framed
        as announcing a departure intended to be effective within 18 months of the
        date of the announcement will qualify (e.g., neither \\\"I will leave office
        in 2 years,\\\" nor \\\"I will not be in office forever,\\\" would qualify).\\n\\nAnnouncements
        of temporary leaves of absence, dated suspensions, indefinite suspensions,
        administrative leaves, or other temporary changes to the specified person's
        duties in the specified position do not qualify.\\n\\nThe following do not
        qualify as public and definitive announcements: statements that the specified
        person is considering or open to departing; conditional statements that the
        specified person will depart only if certain conditions are met; the announcement
        of an offer of resignation that requires acceptance and remains pending or
        has been refused; media reports that the specified person plans to depart;
        statements made in sarcasm or jest; and statements by persons other than the
        specified person, the relevant authority governing the specified position,
        or their respective authorized representatives.\\n\\nIf the specified person
        holds the specified position on a predefined term with a scheduled end date,
        only announcements that they will depart the position prior to the scheduled
        end of their term qualify.\\n\\nIf the specified person formally ceases to
        hold the specified position before the end of their scheduled term without
        a qualifying announcement, the market will resolve to \\\"Yes\\\" if a consensus
        of credible reporting confirms the departure by the specified date, 11:59
        PM ET.\\n\\nThe primary resolution sources for this market will be official
        information from Kevin Warsh and the Federal Reserve of the United States;
        however, a consensus of credible reporting may also be used.\",\"resolutionSource\":\"\",\"startDate\":\"2026-07-24T15:51:01.777165Z\",\"creationDate\":\"2026-07-24T15:54:58.193914Z\",\"endDate\":\"2027-07-01T03:59:00Z\",\"image\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/warsh-d8fb8796fd.png\",\"icon\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/warsh-d8fb8796fd.png\",\"active\":true,\"closed\":false,\"archived\":false,\"new\":false,\"featured\":false,\"restricted\":true,\"liquidity\":69963.82966,\"volume\":54880.12120700001,\"openInterest\":5715.6638920000005,\"sortBy\":\"ascending\",\"createdAt\":\"2026-07-24T15:46:47.474658Z\",\"updatedAt\":\"2026-11-10T16:10:26.08518Z\",\"competitive\":0.8347071221385196,\"enableOrderBook\":true,\"liquidityClob\":69963.82966,\"negRisk\":false,\"commentCount\":0,\"markets\":[{\"id\":\"3081879\",\"question\":\"Will
