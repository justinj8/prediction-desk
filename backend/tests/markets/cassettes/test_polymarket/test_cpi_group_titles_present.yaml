        Inflation US - Annual\",\"description\":\"This is a market about inflation
        over the 12-month period ending October 2026, before seasonal adjustment,
        as reported by the Bureau of Labor Statistics.\\n\\nThis market will resolve
        to the percentage change in the Consumer Price Index (CPI) over the 12-month
        period ending in October 2026 according to the monthly Bureau of Labor Statistics
        (BLS) report.\\n\\nThe resolution source for this market will be the BLS Consumer
        Price Index report released for October 2026 (https://www.bls.gov/bls/news-release/cpi.htm),
        currently scheduled to be released on November 10, 2026, at 8:30 AM ET. Resolution
        of this market will take place upon release of the aforementioned data.\\n\\nNote:
        the resolution source for this market will be the official monthly BLS CPI
        news release, which reports inflation over 12-month periods to only one decimal
        point (e.g., 2.9%). Thus, this is the level of precision that will be used
        when resolving the market.\\n\\nIf the BLS does not release the relevant figures
        on the scheduled date, this market may remain open up until the scheduled
        release time of the next CPI report (https://www.bls.gov/schedule). If the
